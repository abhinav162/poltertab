<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#111118" />
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA" />
      <stop offset="100%" stop-color="#B4BEFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="100" fill="url(#bg)" />

  <!-- Browser Window Frame -->
  <rect x="75" y="140" width="350" height="220" rx="12" fill="#313244" stroke="#45475A" stroke-width="2" />
  
  <!-- Browser Header -->
  <path d="M 75 152 A 12 12 0 0 1 87 140 L 413 140 A 12 12 0 0 1 425 152 L 425 165 L 75 165 Z" fill="#181825" />
  
  <!-- macOS Buttons -->
  <circle cx="95" cy="152.5" r="4.5" fill="#F38BA8" />
  <circle cx="112" cy="152.5" r="4.5" fill="#F9E2AF" />
  <circle cx="129" cy="152.5" r="4.5" fill="#A6E3A1" />

  <!-- The Inactive Tab -->
  <path d="M 275 165 L 285 145 L 365 145 L 375 165 Z" fill="#1E1E2E" opacity="0.6"/>

  <!-- The Active Tab -->
  <path d="M 160 165 L 170 145 L 260 145 L 270 165 Z" fill="#313244" />
  <path d="M 160 165 L 170 145 L 260 145 L 270 165 Z" fill="none" stroke="#89B4FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- The Ghost / Poltergeist emerging from the tab -->
  <!-- Sleek, geometric ghost body -->
  <path d="M 175 240 
           C 175 180, 255 180, 255 240 
           L 255 300
           C 255 310, 242.5 320, 235 305
           C 227.5 290, 215 290, 215 310
           C 215 320, 202.5 320, 195 305
           C 187.5 290, 175 305, 175 295 Z" 
        fill="url(#ghostGrad)" filter="url(#glow)"/>

  <!-- Ghost Eyes -->
  <circle cx="202" cy="225" r="4.5" fill="#1E1E2E" />
  <circle cx="228" cy="225" r="4.5" fill="#1E1E2E" />
  
  <!-- Ghost "Floating" shadow trail underneath -->
  <ellipse cx="215" cy="345" rx="35" ry="4" fill="#181825" opacity="0.8" />
</svg>
