name: Publish

# Publishing is driven by GitHub Releases: cut a release, this ships it.
# The version string decides the npm channel — see scripts/release-meta.js.
#
# release-please uses RELEASE_PLEASE_TOKEN (a PAT) to create releases, which
# fires `release: published` here — no explicit workflow_call needed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v1.1.0-beta.1)"
        required: true
      dry_run:
        description: "Run every check and pack the tarball, but do not publish"
        type: boolean
        default: true

permissions:
  contents: write # attach the extension zip to the release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release points at a tag; a manual run names one. Either way we
          # publish the tagged tree, never whatever main happens to be at.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Nothing reaches the registry that cannot pass its own suite. npm
      # unpublish is heavily restricted, so this is the last cheap gate.
      - name: Test
        run: npm test

      - name: Resolve channel
        id: meta
        run: |
          node scripts/release-meta.js \
            "${{ github.event.release.tag_name || inputs.tag }}" \
            "${{ github.event.release.prerelease || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: npm pack

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build extension zip
        run: |
          # cd into chrome-extension so manifest.json lands at the zip root,
          # as required by the Chrome Web Store uploader.
          (cd chrome-extension && zip -rq \
            "../poltertab-extension-v${{ steps.meta.outputs.version }}.zip" \
            . -x '*.DS_Store')

      # Also runs for a manual re-run, not just the release event. Gating this on
      # `event_name == 'release'` meant a re-run could publish to npm and still
      # leave the release with no zip — which is exactly the state a re-run
      # exists to repair. Skipped on a dry run, and tolerated when the tag has
      # no release yet so a dispatch against a bare tag still publishes.
      # --clobber so re-running replaces the asset instead of failing.
      - name: Attach extension zip to the release
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "poltertab-extension-v${{ steps.meta.outputs.version }}.zip" --clobber
            echo "attached to $TAG"
          else
            echo "::warning::no GitHub release for $TAG — zip built but not attached"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### Published \`poltertab@${{ steps.meta.outputs.version }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| npm tag | \`${{ steps.meta.outputs.dist_tag }}\` |"
            echo "| install | \`npm install -g poltertab@${{ steps.meta.outputs.dist_tag }}\` |"
            echo "| dry run | ${{ inputs.dry_run && 'yes — nothing published' || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # After a *final* release, move the `beta` dist-tag — but only when the new
  # stable is strictly semver-greater than what @beta currently resolves to.
  # Full semver ordering is used: 1.11.0 > 1.11.0-beta.3 (stable outranks its
  # own prerelease) and 1.10.2 < 1.11.0-beta.3 (hotfix behind active major beta).
  # Decision logic lives in scripts/move-beta-tag-decision.js (shared with the
  # test script) so the workflow and the test always exercise the same code.
  # Test cases: node scripts/test-move-beta-tag.js
  move-beta-tag:
    needs: publish
    if: ${{ !inputs.dry_run && !contains(github.event.release.tag_name || inputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Move beta dist-tag to final (semver-guarded)
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CURRENT_BETA=$(npm view poltertab@beta version 2>/dev/null || echo "0.0.0")

          # Decision delegated to scripts/move-beta-tag-decision.js (same module
          # the test suite requires) — no logic duplicated in this heredoc.
          DECISION=$(VERSION="$VERSION" CURRENT_BETA="$CURRENT_BETA" node scripts/move-beta-tag-decision.js)

          if [ "$DECISION" = "move" ]; then
            npm dist-tag add "poltertab@${VERSION}" beta
            echo "Moved beta -> ${VERSION} (was ${CURRENT_BETA})"
          else
            echo "Skipped: ${VERSION} is not semver-greater than ${CURRENT_BETA}; beta stays at ${CURRENT_BETA}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # After a *stable* npm publish, register/update the entry in the official MCP
  # Registry so discovery tools track the release. Authenticates with GitHub
  # OIDC (id-token) — no new secret. Stable-only (the tag carries no '-<pre>'
  # suffix) and skipped on a dry run, mirroring move-beta-tag's guard, so a beta
  # never reaches the registry. `needs: publish` means it runs only after npm.
  publish-mcp-registry:
    needs: publish
    if: ${{ !inputs.dry_run && !contains(github.event.release.tag_name || inputs.tag, '-') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for `mcp-publisher login github-oidc`
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tagged tree's server.json is already in sync (release-please runs
      # sync-server-version.js on the release PR), but re-run it so a hand-cut
      # tag can never publish stale metadata — the registry rejects a version
      # that does not match the npm package it points at.
      - name: Sync server.json version
        run: node scripts/sync-server-version.js

      - name: Install mcp-publisher
        env:
          # Pin the release instead of tracking releases/latest: this job holds
          # an OIDC token for the whole io.github.abhinav162/* namespace, so an
          # upstream release compromise must not auto-apply. The sha256 is pinned
          # here (not read from the release's own checksums file) so a tampered
          # re-release of the same tag is rejected too. Bump both together; the
          # value is for mcp-publisher_linux_amd64.tar.gz (runner is ubuntu).
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
