<!doctype html>
<html>
  <head>
    <title>PolterTab MCP Sessions</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 15px;
        min-width: 300px;
        margin: 0;
      }
      h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ccc;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }
      .status {
        font-weight: bold;
        color: #888;
      }
      .status.connected {
        color: green;
      }
      .status.disconnected {
        color: red;
      }
      .status.connecting {
        color: orange;
      }

      .session-list {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 250px;
        overflow-y: auto;
      }
      .session-item {
        background: #f5f5f5;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 8px 12px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .session-name {
        font-weight: bold;
        margin-bottom: 4px;
        display: block;
      }
      .session-meta {
        color: #666;
        font-size: 11px;
      }
      .empty-state {
        color: #888;
        font-style: italic;
        text-align: center;
        padding: 20px 0;
      }
      button {
        padding: 4px 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .actions {
        margin-top: 10px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>Active Agents</h3>
      <span id="conn-status" class="status disconnected">Disconnected</span>
    </div>
    <ul id="session-list" class="session-list">
      <div class="empty-state">Loading...</div>
    </ul>
    <div class="actions">
      <button id="refreshBtn">Refresh List</button>
      <button id="optionsBtn">Settings</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
