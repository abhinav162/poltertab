<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>File Upload — Shadow DOM</title></head>
<body>
  <h1>Shadow DOM file input</h1>
  <div id="shadow-host"></div>
  <div id="result">No file selected</div>
  <script>
    const host = document.getElementById('shadow-host');
    const shadow = host.attachShadow({ mode: 'open' });
    const input = document.createElement('input');
    input.type = 'file'; input.id = 'shadow-file-input'; input.accept = '*/*';
    shadow.appendChild(input);
    input.addEventListener('change', function() {
      const f = this.files[0];
      document.getElementById('result').textContent = f ? f.name : 'No file selected';
    });
  </script>
</body></html>
