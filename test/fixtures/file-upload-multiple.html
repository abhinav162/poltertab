<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>File Upload — Multiple</title></head>
<body>
  <h1>Multiple file input</h1>
  <input id="file-input" type="file" multiple accept="*/*">
  <div id="result">No files selected</div>
  <script>
    document.getElementById('file-input').addEventListener('change', function () {
      const names = Array.from(this.files).map(function (f) { return f.name; });
      document.getElementById('result').textContent = names.length ? names.join(', ') : 'No files selected';
    });
  </script>
</body>
</html>
